# PulseAudio Daemon Configuration for WSL2
# This file should be placed at: C:\Program Files\pulse\etc\pulse\daemon.conf
# Or: %USERPROFILE%\pulseaudio\etc\pulse\daemon.conf

# IMPORTANT: Set exit-idle-time to -1 to prevent PulseAudio from exiting
# This keeps the server running for WSL2 connections
exit-idle-time = -1

# Run as daemon (background process)
daemonize = yes

# Default sample rate (16kHz is good for voice, 44.1kHz for music)
default-sample-rate = 16000

# Allow higher sample rates if requested
alternate-sample-rate = 44100

# Default sample format
default-sample-format = s16le

# Default channel map (stereo)
default-channel-map = front-left,front-right

# Default fragment size
default-fragments = 4
default-fragment-size-msec = 25

# Logging
log-level = notice
# Uncomment for debugging:
# log-level = debug

# Disable high priority (may cause issues on Windows)
high-priority = no
nice-level = -11

# Realtime scheduling (disabled on Windows)
realtime-scheduling = no
realtime-priority = 5

# Disable CPU limit (not applicable on Windows)
rlimit-rtprio = 9
rlimit-rttime = 200000
